<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заявка — RUNA VYSHYVANKA</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 16px; max-width: 400px; margin: 0 auto; }
    label { display: block; margin: 12px 0 6px; font-weight: 600; }
    input, select, textarea { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 14px; background: #0088cc; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    .success { color: #2e7d32; margin-top: 16px; }
  </style>
</head>
<body>
  <h2>📋 Залишити заявку</h2>

  <label>Тип заявки</label>
  <select name="type">
    <option value="Жіноча вишиванка">Жіноча вишиванка</option>
    <option value="Чоловіча вишиванка">Чоловіча вишиванка</option>
    <option value="Парний комплект">Парний комплект</option>
    <option value="Індивідуальне пошиття">Індивідуальне пошиття</option>
    <option value="Подарунок">Подарунок</option>
  </select>

  <label>Бажаний термін</label>
  <select name="term">
    <option value="Якнайшвидше">Якнайшвидше</option>
    <option value="До 2 тижнів">До 2 тижнів</option>
    <option value="До 1 місяця">До 1 місяця</option>
    <option value="Термін не критичний">Термін не критичний</option>
  </select>

  <label>Ваше ім’я</label>
  <input type="text" name="name" placeholder="Наприклад, Олена" required>

  <label>Телефон або Telegram</label>
  <input type="tel" name="phone" placeholder="+380 XX XXX XX XX" required>

  <label>Коментар</label>
  <textarea name="comment" rows="3" placeholder="Бажано, модель, розмір, колір..."></textarea>

  <button id="send">Отримати консультацію</button>

  <div id="result"></div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', function() {
    const tg = window.Telegram.WebApp;
    tg.expand(); // розгорнути на весь екран
  
    const btn = document.getElementById('send');
    if (!btn) return;
  
    btn.addEventListener('click', function() {
      // Отримуємо дані з форми
      const data = {
        type: document.querySelector('select[name="type"]').value,
        term: document.querySelector('select[name="term"]').value,
        name: document.querySelector('input[name="name"]').value.trim(),
        phone: document.querySelector('input[name="phone"]').value.trim(),
        comment: document.querySelector('textarea[name="comment"]').value.trim()
      };
  
      // Перевірка
      if (!data.name || !data.phone) {
        alert('⚠️ Вкажіть ім’я та телефон.');
        return;
      }
  
      // Надсилаємо дані ботові через tg.sendData()
      const json = JSON.stringify(data);
      tg.sendData(json);
  
      // Опціонально: показати завантаження
      btn.textContent = 'Надсилаємо...';
      btn.disabled = true;
    });
  });
  </script>
</body>
</html>
